<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NODESS · Recursos Fúngicos del ITVM</title>
    <link rel="icon" type="image/jpeg" href="NODESS_ITVM.jpeg">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            /* Mismo crema que el fondo del logo, para que no se note el cuadro de la imagen */
            background: #fdf9f0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
            padding: 1.5rem;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        /* ===== Logo interactivo ===== */
        .logo-interactivo {
            width: min(88vw, 78vh, 640px);
            height: auto;
            display: block;
            overflow: visible;
            animation: aparecer 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .zona {
            cursor: pointer;
            transform-box: view-box;
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                        filter 0.35s ease;
        }
        .zona-cerdo { transform-origin: 433px 552px; }
        .zona-setas { transform-origin: 889px 526px; }

        a:hover .zona,
        a:focus-visible .zona {
            transform: scale(1.08);
            filter: drop-shadow(0 10px 14px rgba(0, 0, 0, 0.25));
        }
        a:active .zona { transform: scale(1.03); }
        a:focus { outline: none; }

        /* Pequeño "latido" al cargar para indicar que se puede tocar */
        .zona-cerdo { animation: latido 0.9s ease-in-out 1.0s 2; }
        .zona-setas { animation: latido 0.9s ease-in-out 1.5s 2; }

        @keyframes latido {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.05); }
        }

        @keyframes aparecer {
            from { opacity: 0; transform: translateY(-12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ===== Indicaciones ===== */
        .guia {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.6rem 1.2rem;
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #4b5563;
        }
        .guia a {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.45rem 1rem;
            border-radius: 999px;
            border: 1px solid #e5dcc3;
            background: rgba(255, 255, 255, 0.7);
            color: inherit;
            text-decoration: none;
            transition: background 0.25s, border-color 0.25s, color 0.25s;
        }
        .guia strong { color: #1f5d1a; letter-spacing: 0.03em; }
        .guia a.activa,
        .guia a:hover {
            background: #1f5d1a;
            border-color: #1f5d1a;
            color: #fff;
        }
        .guia a.activa strong,
        .guia a:hover strong { color: #fff; }

        .footer-hint {
            padding-top: 1.5rem;
            color: #9ca3af;
            font-size: 0.85rem;
            text-align: center;
            letter-spacing: 0.02em;
            user-select: none;
        }

        @media (prefers-reduced-motion: reduce) {
            .zona, .logo-interactivo { animation: none; transition: none; }
        }
    </style>
</head>
<body>

    <main>
        <svg class="logo-interactivo" viewBox="0 0 1254 1254" role="img"
             aria-label="NODESS - Recursos Fúngicos del ITVM">
            <defs>
                <!-- Siluetas recortadas del logo -->
                <clipPath id="clip-cerdo"><path d="M653,442 L647,436 L640,436 L633,445 L610,444 L595,429 L578,421 L575,408 L569,400 L555,387 L551,387 L550,396 L539,412 L538,423 L530,427 L522,427 L513,419 L503,414 L472,413 L463,409 L458,409 L463,426 L463,439 L467,453 L472,462 L479,469 L479,478 L469,486 L447,493 L427,493 L403,490 L368,490 L352,492 L332,497 L312,505 L296,515 L274,533 L265,532 L267,509 L265,504 L260,499 L252,495 L242,495 L229,500 L220,509 L215,520 L217,548 L205,549 L205,553 L208,554 L208,559 L231,556 L240,560 L257,561 L257,570 L254,581 L254,599 L262,622 L262,633 L260,637 L247,648 L246,661 L252,676 L252,699 L257,701 L258,715 L262,715 L270,709 L277,707 L291,707 L290,680 L293,672 L301,663 L306,662 L318,655 L328,656 L328,667 L344,685 L350,696 L351,702 L388,697 L388,693 L375,675 L374,662 L387,649 L395,636 L422,639 L459,636 L464,643 L465,656 L473,664 L475,683 L479,683 L481,685 L481,692 L486,692 L491,687 L499,683 L513,683 L513,678 L508,666 L508,651 L510,643 L518,643 L528,653 L531,665 L540,675 L541,687 L548,690 L550,698 L555,698 L568,690 L577,690 L577,686 L567,665 L567,644 L559,627 L560,587 L570,567 L573,551 L583,538 L583,534 L607,524 L614,519 L628,504 L637,501 L645,492 L650,479 L655,478 L659,474 L660,458Z"/></clipPath>
                <clipPath id="clip-setas"><path d="M784,268 L773,272 L748,286 L714,312 L686,342 L678,354 L671,371 L672,385 L687,397 L707,401 L735,401 L751,403 L765,407 L766,416 L744,428 L718,451 L708,456 L703,456 L678,475 L663,490 L646,513 L638,529 L633,547 L635,558 L647,567 L664,571 L706,573 L727,582 L744,596 L744,604 L712,606 L695,612 L674,624 L655,640 L641,657 L634,670 L632,682 L636,688 L646,693 L656,695 L679,695 L689,697 L699,702 L714,716 L722,730 L726,742 L734,744 L739,749 L811,771 L840,777 L859,778 L865,784 L869,784 L909,767 L910,761 L916,756 L929,751 L986,719 L1030,689 L1042,688 L1063,662 L1079,637 L1079,632 L1072,625 L1072,616 L1081,607 L1081,594 L1074,594 L1069,597 L1060,597 L1059,587 L1073,571 L1088,562 L1117,559 L1133,554 L1144,543 L1145,528 L1135,502 L1119,479 L1118,475 L1116,475 L1109,467 L1087,449 L1061,435 L1031,427 L1005,426 L984,429 L968,434 L959,439 L950,438 L950,430 L955,425 L971,416 L984,412 L1011,410 L1031,406 L1039,402 L1047,391 L1045,376 L1031,352 L1001,320 L973,297 L959,288 L948,288 L945,285 L911,268Z"/></clipPath>
            </defs>

            <!-- Logo completo de fondo -->
            <image href="NODESS_ITVM.jpeg" width="1254" height="1254"/>

            <!-- Cerdo → FUNGI-PORK -->
            <a id="link-fungi" href="#" data-guia="guia-fungi" aria-label="Ir a FUNGI-PORK">
                <title>Ir a FUNGI-PORK</title>
                <g class="zona zona-cerdo">
                    <image href="NODESS_ITVM.jpeg" width="1254" height="1254" clip-path="url(#clip-cerdo)"/>
                </g>
            </a>

            <!-- Setas → SIAF-AGAVE -->
            <a id="link-siaf" href="#" data-guia="guia-siaf" aria-label="Ir a SIAF-AGAVE">
                <title>Ir a SIAF-AGAVE</title>
                <g class="zona zona-setas">
                    <image href="NODESS_ITVM.jpeg" width="1254" height="1254" clip-path="url(#clip-setas)"/>
                </g>
            </a>
        </svg>

        <nav class="guia">
            <a id="guia-fungi" href="#">🐷 <span>El cerdito te lleva a</span> <strong>FUNGI-PORK</strong></a>
            <a id="guia-siaf" href="#">🍄 <span>Las setas te llevan a</span> <strong>SIAF-AGAVE</strong></a>
        </nav>
    </main>

    <footer class="footer-hint">
        Pasa el cursor sobre el cerdito o las setas y haz clic para entrar
    </footer>

    <script>
        // =========================================================================
        // CONFIGURACIÓN DE ENLACES (Modalidad gratuita GitHub Pages)
        // =========================================================================
        const CONFIG = {
            urlSiaf: "https://agrofungo.github.io/SIAF-AGAVE/",
            urlFungi: "https://agrofungo.github.io/FUNGI-PORK/"
        };

        document.getElementById('link-siaf').setAttribute('href', CONFIG.urlSiaf);
        document.getElementById('link-fungi').setAttribute('href', CONFIG.urlFungi);
        document.getElementById('guia-siaf').href = CONFIG.urlSiaf;
        document.getElementById('guia-fungi').href = CONFIG.urlFungi;

        // Resalta la etiqueta de abajo cuando el cursor está sobre el cerdo o las setas
        document.querySelectorAll('svg a[data-guia]').forEach(function (a) {
            const guia = document.getElementById(a.dataset.guia);
            a.addEventListener('mouseenter', function () { guia.classList.add('activa'); });
            a.addEventListener('mouseleave', function () { guia.classList.remove('activa'); });
        });
    </script>

</body>
</html>
